<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timer Odong-Odong · Samarinda</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #0f172a;
            min-height: 100vh;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .app-wrapper {
            max-width: 1280px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(4px);
            padding: 14px 24px;
            border-radius: 40px;
            border: 1px solid rgba(255, 215, 0, 0.08);
        }

        .header h1 {
            font-weight: 700;
            font-size: 1.8rem;
            background: linear-gradient(to right, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header h1 small {
            font-size: 1rem;
            font-weight: 400;
            color: #94a3b8;
            background: #1e293b;
            padding: 2px 16px;
            border-radius: 40px;
        }

        .date-badge {
            color: #cbd5e1;
            background: #1e293b;
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 0.9rem;
            border: 1px solid #334155;
        }

        /* PANEL OPERATOR */
        .operator-panel {
            background: #0b1120;
            border-radius: 32px;
            padding: 14px 24px;
            border: 1px solid #2d3a52;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 12px 16px;
            box-shadow: inset 0 -4px 0 #0f172a;
        }

        .operator-panel .panel-label {
            color: #94a3b8;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-right: 4px;
        }

        .btn-operator {
            padding: 10px 24px;
            border-radius: 40px;
            border: none;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3);
        }

        .btn-operator:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.3);
        }

        .btn-operator:disabled {
            opacity: 0.4;
            transform: translateY(0);
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3);
            pointer-events: none;
        }

        .btn-start-all {
            background: #16a34a;
            color: white;
            border: 1px solid #15803d;
        }
        .btn-start-all:hover {
            background: #22c55e;
        }

        .btn-pause-all {
            background: #ca8a04;
            color: white;
            border: 1px solid #a16207;
        }
        .btn-pause-all:hover {
            background: #eab308;
        }

        /* SETEL HARGA */
        .harga-control {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #1e293b;
            padding: 4px 16px 4px 12px;
            border-radius: 40px;
            border: 1px solid #334155;
        }

        .harga-control label {
            color: #94a3b8;
            font-weight: 500;
            font-size: 0.8rem;
        }

        .harga-control input {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 40px;
            padding: 4px 10px;
            width: 80px;
            color: #f8fafc;
            font-weight: 600;
            font-size: 0.9rem;
            outline: none;
            text-align: center;
        }

        .harga-control input:focus {
            border-color: #facc15;
        }

        .harga-control .btn-set-harga {
            background: #facc15;
            border: none;
            border-radius: 40px;
            padding: 4px 14px;
            font-weight: 700;
            color: #0f172a;
            cursor: pointer;
            font-size: 0.75rem;
            transition: 0.1s;
        }

        .harga-control .btn-set-harga:hover {
            background: #fde047;
        }

        /* GRID TIMER */
        .timer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }

        .timer-card {
            background: #0b1120;
            border-radius: 28px;
            padding: 16px 12px 18px;
            border: 1px solid #2d3a52;
            box-shadow: inset 0 -4px 0 #0f172a, 0 8px 20px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.15s;
            position: relative;
        }

        .timer-card.active {
            border-color: #4ade80;
            box-shadow: 0 0 20px #4ade8030, inset 0 -4px 0 #4ade80;
        }

        .timer-card.paused {
            opacity: 0.7;
            border-color: #facc15;
        }

        .timer-card.finished {
            border-color: #ef4444;
            box-shadow: 0 0 30px #ef444460, inset 0 -4px 0 #ef4444;
        }

        .timer-card.finished .timer-display {
            animation: growPulse 0.6s ease-in-out 3;
        }

        @keyframes growPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.4); color: #ef4444; text-shadow: 0 0 40px #ef4444, 0 0 80px #ef4444; }
            100% { transform: scale(1); }
        }

        .unit-label {
            font-weight: 600;
            font-size: 1rem;
            color: #e2e8f0;
            background: #1e293b;
            padding: 2px 16px;
            border-radius: 40px;
            letter-spacing: 0.3px;
            margin-bottom: 4px;
        }

        .timer-display {
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-size: 2.8rem;
            font-weight: 700;
            color: #f8fafc;
            letter-spacing: 2px;
            line-height: 1.2;
            background: #0f172a;
            padding: 2px 12px;
            border-radius: 40px;
            width: 100%;
            text-align: center;
            margin: 4px 0;
            text-shadow: 0 0 12px #38bdf850;
            transition: all 0.1s;
        }

        .timer-display.warning {
            color: #facc15;
            text-shadow: 0 0 20px #facc15;
        }

        .timer-display.danger {
            color: #f87171;
            text-shadow: 0 0 25px #ef4444;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .habis-badge {
            font-size: 1.8rem;
            font-weight: 900;
            color: #ef4444;
            text-shadow: 0 0 30px #ef4444, 0 0 60px #ef4444;
            letter-spacing: 4px;
            display: none;
            animation: habisGrow 0.5s ease-out;
        }

        @keyframes habisGrow {
            0% { transform: scale(0.2); opacity: 0; }
            60% { transform: scale(1.5); opacity: 1; }
            100% { transform: scale(1); }
        }

        .timer-card.finished .habis-badge {
            display: block;
        }

        .timer-card.finished .timer-display {
            display: none;
        }

        .status-badge {
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: #1e293b;
            padding: 2px 14px;
            border-radius: 40px;
            color: #94a3b8;
            border: 1px solid #334155;
            margin: 4px 0 8px;
        }

        .status-badge.playing {
            color: #4ade80;
            border-color: #4ade8060;
        }

        .status-badge.paused {
            color: #facc15;
            border-color: #facc1560;
        }

        .status-badge.stopped {
            color: #f87171;
            border-color: #f8717160;
        }

        .unit-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 6px;
            width: 100%;
        }

        .unit-actions .btn {
            padding: 5px 12px;
            font-size: 0.7rem;
            border-radius: 40px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.1s;
            background: #1e293b;
            color: #cbd5e1;
            border: 1px solid #334155;
            flex: 1 0 auto;
            min-width: 50px;
        }

        .unit-actions .btn-start {
            background: #16a34a;
            color: white;
            border-color: #15803d;
        }
        .unit-actions .btn-start:hover {
            background: #22c55e;
        }
        .unit-actions .btn-pause {
            background: #ca8a04;
            color: white;
            border-color: #a16207;
        }
        .unit-actions .btn-pause:hover {
            background: #eab308;
        }
        .unit-actions .btn-stop {
            background: #dc2626;
            color: white;
            border-color: #b91c1c;
        }
        .unit-actions .btn-stop:hover {
            background: #ef4444;
        }
        .unit-actions .btn-reset {
            background: #475569;
            color: white;
            border-color: #334155;
        }
        .unit-actions .btn-reset:hover {
            background: #64748b;
        }

        .unit-actions .btn-bayar {
            background: #facc15;
            color: #0f172a;
            border-color: #fbbf24;
            font-weight: 700;
        }
        .unit-actions .btn-bayar:hover {
            background: #fde047;
        }

        .unit-actions .btn:disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        /* REKAP SEDERHANA */
        .rekap-panel {
            background: #0b1120;
            border-radius: 32px;
            padding: 20px 24px 24px;
            border: 1px solid #2d3a52;
        }

        .rekap-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }

        .rekap-header h2 {
            color: #facc15;
            font-weight: 600;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .rekap-header h2 span {
            color: #94a3b8;
            font-weight: 400;
            font-size: 0.9rem;
        }

        .total-omzet {
            background: #1e293b;
            padding: 6px 20px;
            border-radius: 40px;
            color: #facc15;
            font-weight: 700;
            font-size: 1.2rem;
            border: 1px solid #facc1550;
        }

        .rekap-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 18px;
        }

        .rekap-item {
            background: #1e293b;
            border-radius: 20px;
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #334155;
        }

        .rekap-item .unit-name {
            font-weight: 600;
            color: #e2e8f0;
            font-size: 0.9rem;
        }

        .rekap-item .unit-omzet {
            color: #4ade80;
            font-weight: 700;
            font-size: 1rem;
        }

        .catatan-harian {
            margin-top: 12px;
            border-top: 1px solid #1e293b;
            padding-top: 14px;
        }

        .catatan-harian label {
            color: #cbd5e1;
            font-weight: 500;
            display: block;
            margin-bottom: 4px;
            font-size: 0.9rem;
        }

        .catatan-harian .tanggal-catatan {
            color: #94a3b8;
            font-size: 0.8rem;
            margin-bottom: 6px;
        }

        .catatan-harian textarea {
            width: 100%;
            background: #0f172a;
            border: 1px solid #2d3a52;
            border-radius: 20px;
            padding: 12px 16px;
            color: #e2e8f0;
            font-size: 0.9rem;
            resize: vertical;
            min-height: 60px;
            font-family: inherit;
            outline: none;
        }

        .catatan-harian textarea:focus {
            border-color: #facc15;
        }

        .catatan-harian .tombol-catatan {
            display: flex;
            gap: 10px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .catatan-harian .btn-catatan {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 6px 18px;
            border-radius: 40px;
            color: #cbd5e1;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.1s;
        }

        .catatan-harian .btn-catatan:hover {
            background: #2d3a52;
        }

        .catatan-harian .btn-catatan.primary {
            background: #facc15;
            color: #0f172a;
            border-color: #fbbf24;
        }

        .catatan-harian .btn-catatan.primary:hover {
            background: #fde047;
        }

        .footer {
            color: #475569;
            font-size: 0.75rem;
            text-align: center;
            padding: 8px 0 2px;
            border-top: 1px solid #1e293b;
            margin-top: 8px;
        }

        @media (max-width: 600px) {
            .timer-grid {
                grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            }
            .timer-display {
                font-size: 2.2rem;
            }
            .header h1 {
                font-size: 1.4rem;
            }
            .rekap-grid {
                grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            }
            .habis-badge {
                font-size: 1.4rem;
            }
            .operator-panel {
                padding: 12px 16px;
                gap: 8px;
            }
            .btn-operator {
                padding: 8px 16px;
                font-size: 0.8rem;
            }
            .harga-control {
                padding: 4px 12px 4px 10px;
            }
            .harga-control input {
                width: 60px;
            }
        }
    </style>
</head>
<body>
<div class="app-wrapper">
    <!-- HEADER -->
    <div class="header">
        <h1>
            🎠 Odong-Odong
            <small>Samarinda</small>
        </h1>
        <div class="date-badge" id="dateDisplay"></div>
    </div>

    <!-- PANEL OPERATOR -->
    <div class="operator-panel">
        <span class="panel-label">🎛️ Operator</span>
        <button class="btn-operator btn-start-all" id="startAllBtn">▶ Start All</button>
        <button class="btn-operator btn-pause-all" id="pauseAllBtn">⏸ Pause All</button>
        
        <div class="harga-control">
            <label>💰 Harga</label>
            <input type="number" id="hargaInput" min="0" step="1000" value="5000" />
            <button class="btn-set-harga" id="setHargaBtn">Set</button>
        </div>
    </div>

    <!-- 7 UNIT TIMER -->
    <div id="timerGrid" class="timer-grid"></div>

    <!-- REKAP SEDERHANA -->
    <div class="rekap-panel">
        <div class="rekap-header">
            <h2>📋 Rekapan Omzet <span>harian</span></h2>
            <div class="total-omzet" id="totalOmzet">Rp 0</div>
        </div>

        <div id="rekapGrid" class="rekap-grid"></div>

        <div class="catatan-harian">
            <label for="catatanInput">📝 Catatan pemain / kejadian</label>
            <div class="tanggal-catatan" id="tanggalCatatan"></div>
            <textarea id="catatanInput" placeholder="Tulis catatan harian di sini..."></textarea>
            <div class="tombol-catatan">
                <button class="btn-catatan primary" id="simpanCatatanBtn">💾 Simpan catatan</button>
                <button class="btn-catatan" id="resetCatatanBtn">🗑️ Kosongkan</button>
            </div>
            <div style="margin-top: 6px; color: #64748b; font-size: 0.8rem;" id="catatanStatus"></div>
        </div>
        <div class="footer">⏱️ Countdown 4 menit · Klik Bayar untuk mencatat pemasukan</div>
    </div>
</div>

<script>
    (function() {
        const UNIT_COUNT = 7;
        const MAX_SECONDS = 240;
        let HARGA_PER_BAYAR = 5000;

        let timers = [];
        let omzet = new Array(UNIT_COUNT).fill(0);
        let timerInterval = null;

        const grid = document.getElementById('timerGrid');
        const rekapGrid = document.getElementById('rekapGrid');
        const totalOmzetEl = document.getElementById('totalOmzet');
        const catatanInput = document.getElementById('catatanInput');
        const catatanStatus = document.getElementById('catatanStatus');
        const tanggalCatatan = document.getElementById('tanggalCatatan');
        const hargaInput = document.getElementById('hargaInput');

        const startAllBtn = document.getElementById('startAllBtn');
        const pauseAllBtn = document.getElementById('pauseAllBtn');
        const setHargaBtn = document.getElementById('setHargaBtn');

        const today = new Date();
        const todayKey = today.toISOString().split('T')[0];
        const todayDisplay = today.toLocaleDateString('id-ID', {
            weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
        });
        document.getElementById('dateDisplay').textContent = todayDisplay;
        tanggalCatatan.textContent = '📅 ' + todayDisplay;

        const STORAGE_KEY_PREFIX = 'odong_';
        function getStorageKey(suffix) {
            return STORAGE_KEY_PREFIX + todayKey + '_' + suffix;
        }

        function createTimerData(index) {
            return {
                id: index,
                label: `Unit ${index + 1}`,
                remaining: MAX_SECONDS,
                isRunning: false,
                isPaused: false,
                isFinished: false,
                dom: { card: null, display: null, status: null, habis: null }
            };
        }

        function formatTime(seconds) {
            const s = Math.max(0, Math.floor(seconds));
            const m = Math.floor(s / 60);
            const sec = s % 60;
            return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
        }

        function formatRupiah(angka) {
            return 'Rp ' + angka.toLocaleString('id-ID');
        }

        function updateCardVisuals(timer) {
            const { display, status, card, habis } = timer.dom;
            if (!card) return;

            const remaining = Math.max(0, timer.remaining);
            display.textContent = formatTime(remaining);

            display.classList.remove('warning', 'danger');
            if (timer.isFinished || remaining <= 0) {
                display.classList.add('danger');
            } else if (remaining <= MAX_SECONDS * 0.25) {
                display.classList.add('danger');
            } else if (remaining <= MAX_SECONDS * 0.5) {
                display.classList.add('warning');
            }

            status.classList.remove('playing', 'paused', 'stopped');
            if (timer.isFinished || remaining <= 0) {
                status.textContent = 'HABIS';
                status.classList.add('stopped');
            } else if (timer.isRunning && !timer.isPaused) {
                status.textContent = 'Berjalan';
                status.classList.add('playing');
            } else if (timer.isPaused) {
                status.textContent = 'Jeda';
                status.classList.add('paused');
            } else {
                status.textContent = 'Siap';
            }

            card.classList.remove('active', 'paused', 'finished');
            if (timer.isFinished || remaining <= 0) {
                card.classList.add('finished');
                if (habis) habis.style.display = 'block';
                if (display) display.style.display = 'none';
            } else {
                if (habis) habis.style.display = 'none';
                if (display) display.style.display = 'block';
                if (timer.isRunning && !timer.isPaused) {
                    card.classList.add('active');
                } else if (timer.isPaused) {
                    card.classList.add('paused');
                }
            }
        }

        function renderTimers() {
            grid.innerHTML = '';
            timers.forEach((timer, idx) => {
                const card = document.createElement('div');
                card.className = 'timer-card';

                const label = document.createElement('div');
                label.className = 'unit-label';
                label.textContent = timer.label;

                const display = document.createElement('div');
                display.className = 'timer-display';
                display.textContent = formatTime(timer.remaining);

                const habis = document.createElement('div');
                habis.className = 'habis-badge';
                habis.textContent = 'HABIS';

                const status = document.createElement('div');
                status.className = 'status-badge';
                status.textContent = 'Siap';

                const actions = document.createElement('div');
                actions.className = 'unit-actions';

                const btnStart = document.createElement('button');
                btnStart.className = 'btn btn-start';
                btnStart.textContent = '▶ Start';
                btnStart.dataset.index = idx;

                const btnPause = document.createElement('button');
                btnPause.className = 'btn btn-pause';
                btnPause.textContent = '⏸ Pause';
                btnPause.dataset.index = idx;

                const btnStop = document.createElement('button');
                btnStop.className = 'btn btn-stop';
                btnStop.textContent = '⏹ Stop';
                btnStop.dataset.index = idx;

                const btnReset = document.createElement('button');
                btnReset.className = 'btn btn-reset';
                btnReset.textContent = '⟳ Reset';
                btnReset.dataset.index = idx;

                const btnBayar = document.createElement('button');
                btnBayar.className = 'btn btn-bayar';
                btnBayar.textContent = '💰 Bayar';
                btnBayar.dataset.index = idx;

                actions.append(btnStart, btnPause, btnStop, btnReset, btnBayar);
                card.append(label, display, habis, status, actions);

                grid.appendChild(card);

                timer.dom.card = card;
                timer.dom.display = display;
                timer.dom.status = status;
                timer.dom.habis = habis;

                btnStart.addEventListener('click', () => startUnit(idx));
                btnPause.addEventListener('click', () => pauseUnit(idx));
                btnStop.addEventListener('click', () => stopUnit(idx));
                btnReset.addEventListener('click', () => resetUnit(idx));
                btnBayar.addEventListener('click', () => bayarUnit(idx));

                updateCardVisuals(timer);
            });
        }

        // —————— UNIT CONTROL ——————
        function startUnit(idx) {
            const t = timers[idx];
            if (t.remaining <= 0) {
                resetUnit(idx);
                setTimeout(() => startUnit(idx), 50);
                return;
            }
            if (t.isPaused) {
                t.isPaused = false;
                t.isRunning = true;
            } else if (!t.isRunning) {
                t.isRunning = true;
                t.isPaused = false;
                t.isFinished = false;
            }
            updateCardVisuals(t);
            startGlobalInterval();
        }

        function pauseUnit(idx) {
            const t = timers[idx];
            if (t.isRunning && !t.isPaused && t.remaining > 0) {
                t.isPaused = true;
                updateCardVisuals(t);
            }
        }

        function stopUnit(idx) {
            const t = timers[idx];
            t.isRunning = false;
            t.isPaused = false;
            t.isFinished = false;
            t.remaining = MAX_SECONDS;
            updateCardVisuals(t);
            checkAndClearInterval();
        }

        function resetUnit(idx) {
            const t = timers[idx];
            t.isRunning = false;
            t.isPaused = false;
            t.isFinished = false;
            t.remaining = MAX_SECONDS;
            updateCardVisuals(t);
            checkAndClearInterval();
        }

        function bayarUnit(idx) {
            omzet[idx] += HARGA_PER_BAYAR;
            updateRekap();
            saveDataToStorage();
            // Feedback visual
            const totalEl = document.getElementById(`omzetTotal_${idx}`);
            if (totalEl) {
                totalEl.style.color = '#facc15';
                setTimeout(() => { totalEl.style.color = '#4ade80'; }, 300);
            }
        }

        // —————— OPERATOR CONTROL ——————
        function startAll() {
            let anyStarted = false;
            timers.forEach((t, idx) => {
                if (t.remaining <= 0) {
                    resetUnit(idx);
                }
                if (t.remaining > 0 && !t.isRunning) {
                    t.isRunning = true;
                    t.isPaused = false;
                    t.isFinished = false;
                    anyStarted = true;
                } else if (t.isPaused && t.remaining > 0) {
                    t.isPaused = false;
                    t.isRunning = true;
                    anyStarted = true;
                }
                updateCardVisuals(t);
            });
            if (anyStarted) {
                startGlobalInterval();
            }
        }

        function pauseAll() {
            let anyPaused = false;
            timers.forEach(t => {
                if (t.isRunning && !t.isPaused && t.remaining > 0) {
                    t.isPaused = true;
                    anyPaused = true;
                }
                updateCardVisuals(t);
            });
            if (anyPaused && !timerInterval) {
                startGlobalInterval();
            }
        }

        // —————— SET HARGA ——————
        function setHarga() {
            const val = parseInt(hargaInput.value);
            if (!isNaN(val) && val > 0) {
                HARGA_PER_BAYAR = val;
                // Update semua tombol bayar dengan harga baru
                document.querySelectorAll('.btn-bayar').forEach(btn => {
                    btn.textContent = `💰 ${formatRupiah(HARGA_PER_BAYAR)}`;
                });
                catatanStatus.textContent = '✅ Harga diset: ' + formatRupiah(HARGA_PER_BAYAR);
                setTimeout(() => { catatanStatus.textContent = ''; }, 2000);
                saveDataToStorage();
            } else {
                alert('Masukkan harga yang valid!');
            }
        }

        // —————— GLOBAL INTERVAL ——————
        function startGlobalInterval() {
            if (timerInterval) return;
            timerInterval = setInterval(tick, 1000);
        }

        function checkAndClearInterval() {
            const anyRunning = timers.some(t => t.isRunning && !t.isPaused && t.remaining > 0);
            if (!anyRunning && timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function tick() {
            let anyRunning = false;
            timers.forEach(t => {
                if (t.isRunning && !t.isPaused && t.remaining > 0) {
                    t.remaining = Math.max(0, t.remaining - 1);
                    anyRunning = true;
                    if (t.remaining <= 0) {
                        t.isRunning = false;
                        t.isFinished = true;
                        t.isPaused = false;
                    }
                }
                updateCardVisuals(t);
            });
            if (!anyRunning && timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        // —————— REKAP SEDERHANA ——————
        function renderRekap() {
            rekapGrid.innerHTML = '';
            for (let i = 0; i < UNIT_COUNT; i++) {
                const item = document.createElement('div');
                item.className = 'rekap-item';

                const name = document.createElement('span');
                name.className = 'unit-name';
                name.textContent = `Unit ${i + 1}`;

                const total = document.createElement('span');
                total.className = 'unit-omzet';
                total.id = `omzetTotal_${i}`;
                total.textContent = formatRupiah(omzet[i]);

                item.append(name, total);
                rekapGrid.appendChild(item);
            }
            updateTotalOmzet();
        }

        function updateRekap() {
            for (let i = 0; i < UNIT_COUNT; i++) {
                const el = document.getElementById(`omzetTotal_${i}`);
                if (el) {
                    el.textContent = formatRupiah(omzet[i]);
                }
            }
            updateTotalOmzet();
        }

        function updateTotalOmzet() {
            const total = omzet.reduce((a, b) => a + b, 0);
            totalOmzetEl.textContent = formatRupiah(total);
        }

        // —————— CATATAN ——————
        function loadCatatan() {
            const key = getStorageKey('catatan');
            const saved = localStorage.getItem(key);
            if (saved) {
                catatanInput.value = saved;
            } else {
                catatanInput.value = '';
            }
        }

        function simpanCatatan() {
            const key = getStorageKey('catatan');
            localStorage.setItem(key, catatanInput.value);
            catatanStatus.textContent = '✅ Catatan disimpan ' + new Date().toLocaleTimeString();
            setTimeout(() => { catatanStatus.textContent = ''; }, 3000);
        }

        function resetCatatan() {
            const key = getStorageKey('catatan');
            localStorage.removeItem(key);
            catatanInput.value = '';
            catatanStatus.textContent = '🗑️ Catatan dikosongkan';
            setTimeout(() => { catatanStatus.textContent = ''; }, 2000);
        }

        // —————— STORAGE ——————
        function saveDataToStorage() {
            const omzetKey = getStorageKey('omzet');
            localStorage.setItem(omzetKey, JSON.stringify(omzet));

            const timerKey = getStorageKey('timers');
            const timerState = timers.map(t => ({
                remaining: t.remaining,
                isRunning: t.isRunning,
                isPaused: t.isPaused,
                isFinished: t.isFinished
            }));
            localStorage.setItem(timerKey, JSON.stringify(timerState));

            const hargaKey = getStorageKey('harga');
            localStorage.setItem(hargaKey, String(HARGA_PER_BAYAR));
        }

        function loadDataFromStorage() {
            const omzetKey = getStorageKey('omzet');
            const savedOmzet = localStorage.getItem(omzetKey);
            if (savedOmzet) {
                try {
                    const parsed = JSON.parse(savedOmzet);
                    if (Array.isArray(parsed) && parsed.length === UNIT_COUNT) {
                        omzet = parsed;
                    }
                } catch (e) {}
            }

            const timerKey = getStorageKey('timers');
            const savedTimers = localStorage.getItem(timerKey);
            if (savedTimers) {
                try {
                    const parsed = JSON.parse(savedTimers);
                    if (Array.isArray(parsed) && parsed.length === UNIT_COUNT) {
                        for (let i = 0; i < UNIT_COUNT; i++) {
                            if (parsed[i]) {
                                timers[i].remaining = parsed[i].remaining !== undefined ? parsed[i].remaining : MAX_SECONDS;
                                timers[i].isRunning = parsed[i].isRunning || false;
                                timers[i].isPaused = parsed[i].isPaused || false;
                                timers[i].isFinished = parsed[i].isFinished || false;
                            }
                        }
                    }
                } catch (e) {}
            }
            timers.forEach(t => {
                t.isRunning = false;
                t.isPaused = false;
            });

            const hargaKey = getStorageKey('harga');
            const savedHarga = localStorage.getItem(hargaKey);
            if (savedHarga) {
                const val = parseInt(savedHarga);
                if (!isNaN(val) && val > 0) {
                    HARGA_PER_BAYAR = val;
                    hargaInput.value = val;
                }
            }
        }

        // —————— INIT ——————
        function init() {
            for (let i = 0; i < UNIT_COUNT; i++) {
                timers.push(createTimerData(i));
            }

            loadDataFromStorage();
            renderTimers();
            renderRekap();
            loadCatatan();

            // Update tombol bayar dengan harga
            document.querySelectorAll('.btn-bayar').forEach(btn => {
                btn.textContent = `💰 ${formatRupiah(HARGA_PER_BAYAR)}`;
            });

            startAllBtn.addEventListener('click', startAll);
            pauseAllBtn.addEventListener('click', pauseAll);
            setHargaBtn.addEventListener('click', setHarga);
            hargaInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') setHarga();
            });

            document.getElementById('simpanCatatanBtn').addEventListener('click', simpanCatatan);
            document.getElementById('resetCatatanBtn').addEventListener('click', resetCatatan);

            setInterval(() => {
                saveDataToStorage();
            }, 10000);

            window.addEventListener('beforeunload', () => {
                saveDataToStorage();
            });

            updateTotalOmzet();
        }

        init();
    })();
</script>
</body>
  </html>
