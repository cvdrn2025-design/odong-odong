<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Timer Odong-Odong · Samarinda</title>

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="https://cvdrn2025-design.github.io/odong-odong/manifest.json" />
    <meta name="theme-color" content="#facc15" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Odong-Odong" />
    <link rel="apple-touch-icon" href="icon-192.png" />

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <style>
        /* ========================================
                   RESET & BASE
                ======================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #0f172a;
            min-height: 100vh;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .app-wrapper {
            max-width: 1280px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* ========================================
                   HEADER
                ======================================== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(4px);
            padding: 14px 24px;
            border-radius: 40px;
            border: 1px solid rgba(255, 215, 0, 0.08);
        }

        .header h1 {
            font-weight: 700;
            font-size: 1.8rem;
            background: linear-gradient(to right, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header h1 small {
            font-size: 1rem;
            font-weight: 400;
            color: #94a3b8;
            background: #1e293b;
            padding: 2px 16px;
            border-radius: 40px;
        }

        .date-badge {
            color: #cbd5e1;
            background: #1e293b;
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 0.9rem;
            border: 1px solid #334155;
        }

        /* ========================================
                   USER INFO DISPLAY
                ======================================== */
        .user-info-display {
            background: #1e293b;
            border-radius: 40px;
            padding: 8px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid #334155;
        }

        .user-info-display .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #facc15;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
            color: #0f172a;
        }

        .user-info-display .user-detail {
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .user-info-display .user-detail strong {
            color: #e2e8f0;
            display: block;
            font-size: 0.95rem;
        }

        /* ========================================
                   OPERATOR PANEL
                ======================================== */
        .operator-panel {
            background: #0b1120;
            border-radius: 32px;
            padding: 14px 24px;
            border: 1px solid #2d3a52;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 12px 16px;
            box-shadow: inset 0 -4px 0 #0f172a;
        }

        .operator-panel .panel-label {
            color: #94a3b8;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-right: 4px;
        }

        .btn-operator {
            padding: 10px 24px;
            border-radius: 40px;
            border: none;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3);
        }

        .btn-operator:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.3);
        }

        .btn-operator:disabled {
            opacity: 0.4;
            transform: translateY(0);
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3);
            pointer-events: none;
        }

        .btn-start-all {
            background: #16a34a;
            color: white;
            border: 1px solid #15803d;
        }
        .btn-start-all:hover {
            background: #22c55e;
        }

        .btn-pause-all {
            background: #ca8a04;
            color: white;
            border: 1px solid #a16207;
        }
        .btn-pause-all:hover {
            background: #eab308;
        }

        .btn-tambah-unit {
            background: #2563eb;
            color: white;
            border: 1px solid #1d4ed8;
        }
        .btn-tambah-unit:hover {
            background: #3b82f6;
        }

        .btn-kurang-unit {
            background: #dc2626;
            color: white;
            border: 1px solid #b91c1c;
        }
        .btn-kurang-unit:hover {
            background: #ef4444;
        }

        .harga-control {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #1e293b;
            padding: 4px 16px 4px 12px;
            border-radius: 40px;
            border: 1px solid #334155;
        }

        .harga-control label {
            color: #94a3b8;
            font-weight: 500;
            font-size: 0.8rem;
        }

        .harga-control input {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 40px;
            padding: 4px 10px;
            width: 80px;
            color: #f8fafc;
            font-weight: 600;
            font-size: 0.9rem;
            outline: none;
            text-align: center;
        }

        .harga-control input:focus {
            border-color: #facc15;
        }

        .harga-control .btn-set-harga {
            background: #facc15;
            border: none;
            border-radius: 40px;
            padding: 4px 14px;
            font-weight: 700;
            color: #0f172a;
            cursor: pointer;
            font-size: 0.75rem;
            transition: 0.1s;
        }

        .harga-control .btn-set-harga:hover {
            background: #fde047;
        }

        /* ========================================
                   TIMER GRID
                ======================================== */
        .timer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }

        .timer-card {
            background: #0b1120;
            border-radius: 28px;
            padding: 16px 12px 18px;
            border: 1px solid #2d3a52;
            box-shadow: inset 0 -4px 0 #0f172a, 0 8px 20px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.15s;
            position: relative;
        }

        .timer-card.active {
            border-color: #4ade80;
            box-shadow: 0 0 20px #4ade8030, inset 0 -4px 0 #4ade80;
        }

        .timer-card.paused {
            opacity: 0.7;
            border-color: #facc15;
        }

        .timer-card.finished {
            border-color: #ef4444;
            box-shadow: 0 0 30px #ef444460, inset 0 -4px 0 #ef4444;
        }

        .timer-card.finished .timer-display {
            animation: growPulse 0.6s ease-in-out 3;
        }

        @keyframes growPulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.4);
                color: #ef4444;
                text-shadow: 0 0 40px #ef4444, 0 0 80px #ef4444;
            }
            100% {
                transform: scale(1);
            }
        }

        .unit-label {
            font-weight: 600;
            font-size: 1rem;
            color: #e2e8f0;
            background: #1e293b;
            padding: 2px 16px;
            border-radius: 40px;
            letter-spacing: 0.3px;
            margin-bottom: 4px;
        }

        .timer-display {
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-size: 2.8rem;
            font-weight: 700;
            color: #f8fafc;
            letter-spacing: 2px;
            line-height: 1.2;
            background: #0f172a;
            padding: 2px 12px;
            border-radius: 40px;
            width: 100%;
            text-align: center;
            margin: 4px 0;
            text-shadow: 0 0 12px #38bdf850;
            transition: all 0.1s;
        }

        .timer-display.warning {
            color: #facc15;
            text-shadow: 0 0 20px #facc15;
        }

        .timer-display.danger {
            color: #f87171;
            text-shadow: 0 0 25px #ef4444;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
            100% {
                opacity: 1;
            }
        }

        .habis-badge {
            font-size: 1.8rem;
            font-weight: 900;
            color: #ef4444;
            text-shadow: 0 0 30px #ef4444, 0 0 60px #ef4444;
            letter-spacing: 4px;
            display: none;
            animation: habisGrow 0.5s ease-out;
        }

        @keyframes habisGrow {
            0% {
                transform: scale(0.2);
                opacity: 0;
            }
            60% {
                transform: scale(1.5);
                opacity: 1;
            }
            100% {
                transform: scale(1);
            }
        }

        .timer-card.finished .habis-badge {
            display: block;
        }

        .timer-card.finished .timer-display {
            display: none;
        }

        .status-badge {
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: #1e293b;
            padding: 2px 14px;
            border-radius: 40px;
            color: #94a3b8;
            border: 1px solid #334155;
            margin: 4px 0 8px;
        }

        .status-badge.playing {
            color: #4ade80;
            border-color: #4ade8060;
        }

        .status-badge.paused {
            color: #facc15;
            border-color: #facc1560;
        }

        .status-badge.stopped {
            color: #f87171;
            border-color: #f8717160;
        }

        /* ========================================
                   UNIT ACTIONS
                ======================================== */
        .unit-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 6px;
            width: 100%;
        }

        .unit-actions .btn {
            padding: 5px 12px;
            font-size: 0.7rem;
            border-radius: 40px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            background: #1e293b;
            color: #cbd5e1;
            border: 1px solid #334155;
            flex: 1 0 auto;
            min-width: 50px;
        }

        .unit-actions .btn-start {
            background: #16a34a;
            color: white;
            border-color: #15803d;
        }
        .unit-actions .btn-start:hover {
            background: #22c55e;
        }
        .unit-actions .btn-start:disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        .unit-actions .btn-reset {
            background: #475569;
            color: white;
            border-color: #334155;
        }
        .unit-actions .btn-reset:hover {
            background: #64748b;
        }

        .unit-actions .btn-lanjut {
            background: #2563eb;
            color: white;
            border-color: #1d4ed8;
        }
        .unit-actions .btn-lanjut:hover {
            background: #3b82f6;
        }

        .unit-actions .btn-bayar {
            background: #facc15;
            color: #0f172a;
            border-color: #fbbf24;
            font-weight: 700;
            transition: all 0.3s ease;
        }
        .unit-actions .btn-bayar:hover {
            background: #fde047;
        }
        .unit-actions .btn-bayar.sudah-bayar {
            background: #22c55e;
            color: white;
            border-color: #16a34a;
        }

        .unit-actions .btn:disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        /* ========================================
                   REKAP PANEL
                ======================================== */
        .rekap-panel {
            background: #0b1120;
            border-radius: 32px;
            padding: 20px 24px 24px;
            border: 1px solid #2d3a52;
        }

        .rekap-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }

        .rekap-header h2 {
            color: #facc15;
            font-weight: 600;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .rekap-header h2 span {
            color: #94a3b8;
            font-weight: 400;
            font-size: 0.9rem;
        }

        .rekap-header .rekap-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-rekap {
            padding: 6px 16px;
            border-radius: 40px;
            border: none;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-rekap-reset {
            background: #dc2626;
            color: white;
            border: 1px solid #b91c1c;
        }
        .btn-rekap-reset:hover {
            background: #ef4444;
        }

        .btn-rekap-cetak {
            background: #2563eb;
            color: white;
            border: 1px solid #1d4ed8;
        }
        .btn-rekap-cetak:hover {
            background: #3b82f6;
        }

        .total-omzet {
            background: #1e293b;
            padding: 6px 20px;
            border-radius: 40px;
            color: #facc15;
            font-weight: 700;
            font-size: 1.2rem;
            border: 1px solid #facc1550;
        }

        .rekap-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 18px;
        }

        .rekap-item {
            background: #1e293b;
            border-radius: 20px;
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #334155;
        }

        .rekap-item .unit-name {
            font-weight: 600;
            color: #e2e8f0;
            font-size: 0.9rem;
        }

        .rekap-item .unit-omzet {
            color: #4ade80;
            font-weight: 700;
            font-size: 1rem;
        }

        /* ========================================
                   CATATAN HARIAN
                ======================================== */
        .catatan-harian {
            margin-top: 12px;
            border-top: 1px solid #1e293b;
            padding-top: 14px;
        }

        .catatan-harian label {
            color: #cbd5e1;
            font-weight: 500;
            display: block;
            margin-bottom: 4px;
            font-size: 0.9rem;
        }

        .catatan-harian .tanggal-catatan {
            color: #94a3b8;
            font-size: 0.8rem;
            margin-bottom: 6px;
        }

        .catatan-harian textarea {
            width: 100%;
            background: #0f172a;
            border: 1px solid #2d3a52;
            border-radius: 20px;
            padding: 12px 16px;
            color: #e2e8f0;
            font-size: 0.9rem;
            resize: vertical;
            min-height: 60px;
            font-family: inherit;
            outline: none;
        }

        .catatan-harian textarea:focus {
            border-color: #facc15;
        }

        .catatan-harian .tombol-catatan {
            display: flex;
            gap: 10px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .catatan-harian .btn-catatan {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 6px 18px;
            border-radius: 40px;
            color: #cbd5e1;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.1s;
        }

        .catatan-harian .btn-catatan:hover {
            background: #2d3a52;
        }

        .catatan-harian .btn-catatan.primary {
            background: #facc15;
            color: #0f172a;
            border-color: #fbbf24;
        }

        .catatan-harian .btn-catatan.primary:hover {
            background: #fde047;
        }

        .footer {
            color: #475569;
            font-size: 0.75rem;
            text-align: center;
            padding: 8px 0 2px;
            border-top: 1px solid #1e293b;
            margin-top: 8px;
        }

        /* ========================================
                   LOCK SCREEN
                ======================================== */
        .lock-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            flex-direction: column;
            gap: 24px;
            padding: 20px;
        }

        .lock-screen.hidden {
            display: none;
        }

        .lock-screen .lock-icon {
            font-size: 4rem;
        }

        .lock-screen h2 {
            color: #facc15;
            font-size: 1.8rem;
            font-weight: 700;
        }

        .lock-screen p {
            color: #94a3b8;
            font-size: 1rem;
            text-align: center;
        }

        .lock-screen .pin-input-group {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        .lock-screen .pin-input-group input {
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 40px;
            padding: 12px 20px;
            color: #f8fafc;
            font-size: 1.2rem;
            text-align: center;
            letter-spacing: 4px;
            width: 200px;
            outline: none;
            font-family: 'Courier New', monospace;
        }

        .lock-screen .pin-input-group input:focus {
            border-color: #facc15;
        }

        .lock-screen .pin-input-group .btn-unlock {
            background: #facc15;
            border: none;
            border-radius: 40px;
            padding: 12px 28px;
            font-weight: 700;
            font-size: 1rem;
            color: #0f172a;
            cursor: pointer;
            transition: 0.15s;
        }

        .lock-screen .pin-input-group .btn-unlock:hover {
            background: #fde047;
        }

        .lock-screen .error-msg {
            color: #f87171;
            font-size: 0.9rem;
            min-height: 24px;
        }

        .lock-screen .status-info {
            color: #64748b;
            font-size: 0.8rem;
            text-align: center;
            max-width: 400px;
        }

        .lock-screen .loading {
            color: #94a3b8;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .lock-screen .loading::before {
            content: '';
            width: 16px;
            height: 16px;
            border: 3px solid #334155;
            border-top-color: #facc15;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ========================================
                   RESPONSIVE
                ======================================== */
        @media (max-width: 600px) {
            .timer-grid {
                grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            }
            .timer-display {
                font-size: 2.2rem;
            }
            .header h1 {
                font-size: 1.4rem;
            }
            .rekap-grid {
                grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            }
            .habis-badge {
                font-size: 1.4rem;
            }
            .operator-panel {
                padding: 12px 16px;
                gap: 8px;
            }
            .btn-operator {
                padding: 8px 16px;
                font-size: 0.8rem;
            }
            .harga-control {
                padding: 4px 12px 4px 10px;
            }
            .harga-control input {
                width: 60px;
            }
            .lock-screen .pin-input-group input {
                width: 160px;
                font-size: 1rem;
            }
            .user-info-display {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <!-- ========================================
    LOCK SCREEN
    ======================================== -->
    <div class="lock-screen" id="lockScreen">
        <div class="lock-icon">🔐</div>
        <h2>Odong-Odong</h2>
        <p>Masukkan PIN untuk mengakses aplikasi</p>
        <div class="pin-input-group">
            <input type="password" id="pinInput" maxlength="6" placeholder="PIN 6 digit" autofocus />
            <button class="btn-unlock" id="unlockBtn">Buka</button>
        </div>
        <div class="error-msg" id="errorMsg"></div>
        <div class="status-info" id="statusInfo">Memuat status...</div>
    </div>

    <!-- ========================================
    MAIN APP
    ======================================== -->
    <div class="app-wrapper" id="mainApp" style="display:none;">

        <!-- HEADER -->
        <div class="header">
            <h1>🎠 Odong-Odong <small>Samarinda</small></h1>
            <div class="date-badge" id="dateDisplay"></div>
            <!-- User Info Display (after unlock) -->
            <div class="user-info-display" id="userInfoDisplay" style="display:none;">
                <div class="user-avatar" id="userAvatar">U</div>
                <div class="user-detail">
                    <strong id="userName">User</strong>
                    <span id="userStatus">Aktif</span>
                </div>
            </div>
        </div>

        <!-- OPERATOR PANEL -->
        <div class="operator-panel">
            <span class="panel-label">🎛️ Operator</span>
            <button class="btn-operator btn-start-all" id="startAllBtn">▶ Start All</button>
            <button class="btn-operator btn-pause-all" id="pauseAllBtn">⏸ Pause All</button>
            <button class="btn-operator btn-tambah-unit" id="tambahUnitBtn">➕ Tambah Unit</button>
            <button class="btn-operator btn-kurang-unit" id="kurangUnitBtn">➖ Kurangi Unit</button>
            <div class="harga-control">
                <label>💰 Harga/4 menit</label>
                <input type="number" id="hargaInput" min="0" step="1000" value="5000" />
                <button class="btn-set-harga" id="setHargaBtn">Set</button>
            </div>
        </div>

        <!-- TIMER GRID -->
        <div id="timerGrid" class="timer-grid"></div>

        <!-- REKAP PANEL -->
        <div class="rekap-panel">
            <div class="rekap-header">
                <h2>📋 Rekapan Omzet <span>harian</span></h2>
                <div class="rekap-actions">
                    <button class="btn-rekap btn-rekap-reset" id="resetOmzetBtn">🔄 Reset</button>
                    <button class="btn-rekap btn-rekap-cetak" id="cetakRekapBtn">🖨️ Cetak</button>
                </div>
                <div class="total-omzet" id="totalOmzet">Rp 0</div>
            </div>
            <div id="rekapGrid" class="rekap-grid"></div>

            <!-- CATATAN -->
            <div class="catatan-harian">
                <label for="catatanInput">📝 Catatan pemain / kejadian</label>
                <div class="tanggal-catatan" id="tanggalCatatan"></div>
                <textarea id="catatanInput" placeholder="Tulis catatan harian di sini..."></textarea>
                <div class="tombol-catatan">
                    <button class="btn-catatan primary" id="simpanCatatanBtn">💾 Simpan catatan</button>
                    <button class="btn-catatan" id="resetCatatanBtn">🗑️ Kosongkan</button>
                </div>
                <div style="margin-top: 6px; color: #64748b; font-size: 0.8rem;" id="catatanStatus"></div>
            </div>
            <div class="footer">⏱️ 4 menit per putaran · Klik Lanjut untuk tambah durasi (harga naik)</div>
        </div>
    </div>

    <!-- ========================================
    JAVASCRIPT
    ======================================== -->
    <script>
        // ==========================================
        // SERVICE WORKER REGISTRATION
        // ==========================================
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('https://cvdrn2025-design.github.io/odong-odong/sw.js')
                    .then((registration) => {
                        console.log('✅ Service Worker registered:', registration);
                    })
                    .catch((error) => {
                        console.log('❌ Service Worker registration failed:', error);
                    });
            });

            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!refreshing) {
                    refreshing = true;
                    window.location.reload();
                }
            });
        }

        // ==========================================
        // FIREBASE CONFIG
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyDSH5uW4zNRt-tjwS99bTMc6cb_LV30pYQ",
            authDomain: "odongonline.firebaseapp.com",
            databaseURL: "https://odongonline-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "odongonline",
            storageBucket: "odongonline.firebasestorage.app",
            messagingSenderId: "300816877292",
            appId: "1:300816877292:web:b93fa25279bc13a3f5c7c9"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Cek koneksi Firebase
        database.ref('.info/connected').on('value', (snap) => {
            console.log(snap.val() ? '✅ Terhubung ke Firebase' : '❌ Tidak terhubung ke Firebase');
        });

        // ==========================================
        // KONFIGURASI
        // ==========================================
        const ADMIN_PATH = 'admin';
        const SESSION_KEY = 'odong_akses';
        const USER_KEY = 'odong_user_info';
        const MAX_SECONDS = 240;
        const todayKey = new Date().toISOString().split('T')[0];

        let HARGA_PER_BAYAR = 5000;
        let UNIT_COUNT = 7;
        let timers = [];
        let omzet = [];
        let timerInterval = null;
        let isDataLoaded = false;
        let isSyncing = false;
        let appInited = false;
        let currentUser = null;
        let adminData = null;

        // ==========================================
        // DOM REFS
        // ==========================================
        const $ = (id) => document.getElementById(id);
        const lockScreen = $('lockScreen');
        const mainApp = $('mainApp');
        const pinInput = $('pinInput');
        const unlockBtn = $('unlockBtn');
        const errorMsg = $('errorMsg');
        const statusInfo = $('statusInfo');
        const grid = $('timerGrid');
        const rekapGrid = $('rekapGrid');
        const totalOmzetEl = $('totalOmzet');
        const catatanInput = $('catatanInput');
        const catatanStatus = $('catatanStatus');
        const tanggalCatatan = $('tanggalCatatan');
        const hargaInput = $('hargaInput');
        const startAllBtn = $('startAllBtn');
        const pauseAllBtn = $('pauseAllBtn');
        const tambahUnitBtn = $('tambahUnitBtn');
        const kurangUnitBtn = $('kurangUnitBtn');
        const setHargaBtn = $('setHargaBtn');
        const resetOmzetBtn = $('resetOmzetBtn');
        const cetakRekapBtn = $('cetakRekapBtn');
        const userInfoDisplay = $('userInfoDisplay');
        const userAvatar = $('userAvatar');
        const userName = $('userName');
        const userStatus = $('userStatus');

        const today = new Date();
        const todayDisplay = today.toLocaleDateString('id-ID', {
            weekday: 'long',
            year: 'numeric',
            month: 'long',
            day: 'numeric'
        });

        document.getElementById('dateDisplay').textContent = todayDisplay;
        tanggalCatatan.textContent = '📅 ' + todayDisplay;

        // ==========================================
        // FUNGSI AKSES (PIN) - MULTIPLE USERS
        // ==========================================
        function getAdminData() {
            return database.ref(ADMIN_PATH).once('value').then((snap) => snap.val()).catch(() => null);
        }

        async function validatePin(inputPin) {
            // Fetch fresh data from Firebase
            const data = await getAdminData();
            
            if (!data) return { valid: false, message: 'Sistem belum aktif. Hubungi admin.' };
            
            // Cek multiple users dulu
            if (data.users && Object.keys(data.users).length > 0) {
                for (const [id, user] of Object.entries(data.users)) {
                    if (user.pin === inputPin && user.status === 'active') {
                        // Cek kadaluarsa
                        if (user.tanggalKadaluarsa) {
                            const now = new Date();
                            const expired = new Date(user.tanggalKadaluarsa);
                            if (now > expired) {
                                return { 
                                    valid: false, 
                                    message: 'Langganan ' + user.nama + ' telah kadaluarsa.' 
                                };
                            }
                        }
                        return { 
                            valid: true, 
                            message: 'Akses diterima!',
                            user: { id: id, nama: user.nama, pin: user.pin }
                        };
                    }
                }
                return { valid: false, message: 'PIN salah atau user tidak aktif!' };
            }
            
            // Fallback ke single PIN (legacy)
            if (!data.pin) return { valid: false, message: 'Sistem belum aktif. Hubungi admin.' };
            if (data.tanggalKadaluarsa && new Date() > new Date(data.tanggalKadaluarsa)) {
                return { valid: false, message: 'Langganan telah kadaluarsa. Hubungi admin untuk perpanjang.' };
            }
            return inputPin === data.pin ?
                { valid: true, message: 'Akses diterima!' } :
                { valid: false, message: 'PIN salah!' };
        }

        async function getStatusInfo() {
            const data = await getAdminData();
            
            // Cek multiple users
            if (data && data.users && Object.keys(data.users).length > 0) {
                const activeUsers = Object.values(data.users).filter(u => {
                    if (u.status !== 'active') return false;
                    if (!u.tanggalKadaluarsa) return true;
                    return new Date() < new Date(u.tanggalKadaluarsa);
                });
                return { 
                    aktif: activeUsers.length > 0, 
                    message: activeUsers.length + ' user aktif',
                    users: activeUsers
                };
            }
            
            // Fallback ke single PIN (legacy)
            if (!data || !data.pin) return { aktif: false, message: 'Sistem belum aktif' };
            if (data.tanggalKadaluarsa) {
                const expired = new Date(data.tanggalKadaluarsa);
                if (new Date() > expired) return { aktif: false, message: 'Langganan kadaluarsa' };
                const diff = Math.ceil((expired - new Date()) / (1000 * 60 * 60 * 24));
                return { aktif: true, message: 'Aktif', sisaHari: diff };
            }
            return { aktif: true, message: 'Aktif (tanpa batas)' };
        }

        async function updateStatusInfo() {
            statusInfo.innerHTML = '<div class="loading">Memuat status...</div>';
            const status = await getStatusInfo();
            statusInfo.textContent = status.aktif ?
                (status.sisaHari ? `✅ Aktif · Sisa ${status.sisaHari} hari` : '✅ Aktif (tanpa batas)') :
                `❌ ${status.message}`;
        }

        async function unlockApp() {
            const pin = pinInput.value.trim();
            if (!pin) { 
                errorMsg.textContent = 'Masukkan PIN terlebih dahulu!'; 
                return; 
            }
            
            // Show loading state
            unlockBtn.disabled = true;
            unlockBtn.textContent = 'Memproses...';
            errorMsg.textContent = '';
            
            try {
                const result = await validatePin(pin);
                
                if (result.valid) {
                    currentUser = result.user || { nama: 'Admin', pin: pin };
                    
                    // Save session
                    sessionStorage.setItem(SESSION_KEY, 'true');
                    sessionStorage.setItem(USER_KEY, JSON.stringify(currentUser));
                    
                    // Show main app
                    lockScreen.classList.add('hidden');
                    mainApp.style.display = 'block';
                    
                    // Update user info display
                    updateUserInfoDisplay(currentUser);
                    
                    errorMsg.textContent = '';
                    initApp(); // ✅ Penting: Inisialisasi app setelah unlock
                } else {
                    errorMsg.textContent = '❌ ' + result.message;
                    pinInput.value = '';
                    pinInput.focus();
                }
            } catch (error) {
                console.error('Error during unlock:', error);
                errorMsg.textContent = '❌ Terjadi kesalahan. Coba lagi.';
            } finally {
                // Reset button state
                unlockBtn.disabled = false;
                unlockBtn.textContent = 'Buka';
            }
        }

        function updateUserInfoDisplay(user) {
            if (!user) return;
            
            userInfoDisplay.style.display = 'flex';
            
            // Get initials for avatar
            const initials = user.nama.split(' ')
                .map(word => word[0])
                .slice(0, 2)
                .join('')
                .toUpperCase();
            
            userAvatar.textContent = initials || 'U';
            userName.textContent = user.nama;
            
            // Check status
            if (user.tanggalKadaluarsa) {
                const expired = new Date(user.tanggalKadaluarsa);
                if (new Date() > expired) {
                    userStatus.textContent = '❌ Kadaluarsa';
                    userStatus.style.color = '#f87171';
                } else {
                    const diff = Math.ceil((expired - new Date()) / (1000 * 60 * 60 * 24));
                    userStatus.textContent = `✅ ${diff} hari tersisa`;
                    userStatus.style.color = '#4ade80';
                }
            } else {
                userStatus.textContent = '✅ Aktif';
                userStatus.style.color = '#4ade80';
            }
        }

        async function checkSession() {
            if (sessionStorage.getItem(SESSION_KEY) === 'true') {
                const savedUser = sessionStorage.getItem(USER_KEY);
                if (savedUser) {
                    currentUser = JSON.parse(savedUser);
                }
                
                // Check current status
                const status = await getStatusInfo();
                if (status.aktif) {
                    lockScreen.classList.add('hidden');
                    mainApp.style.display = 'block';
                    
                    if (currentUser) {
                        updateUserInfoDisplay(currentUser);
                    }
                    
                    updateStatusInfo();
                    initApp(); // ✅ Penting: Pastikan initApp dipanggil
                    return true;
                }
                // Session expired, bersihkan
                sessionStorage.removeItem(SESSION_KEY);
                sessionStorage.removeItem(USER_KEY);
            }
            updateStatusInfo();
            return false;
        }

        // Event Lock Screen
        pinInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') unlockApp(); });
        unlockBtn.addEventListener('click', unlockApp);

        // ==========================================
        // FUNGSI UTILITY
        // ==========================================
        function createTimerData(index) {
            return {
                id: index,
                label: `Unit ${index + 1}`,
                remaining: MAX_SECONDS,
                isRunning: false,
                isPaused: false,
                isFinished: false,
                sudahBayar: false,
                jumlahLanjut: 0,
                dom: { card: null, display: null, status: null, habis: null, btnBayar: null }
            };
        }

        function formatTime(seconds) {
            const s = Math.max(0, Math.floor(seconds));
            return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
        }

        function formatRupiah(angka) {
            return 'Rp ' + angka.toLocaleString('id-ID');
        }

        function getHargaBayar(timer) {
            return HARGA_PER_BAYAR * (timer.jumlahLanjut + 1);
        }

        function getDataRef() {
            return database.ref('data/' + todayKey);
        }

        // ==========================================
        // UPDATE VISUALS
        // ==========================================
        function updateCardVisuals(timer) {
            const { display, status, card, habis, btnBayar } = timer.dom;
            if (!card) return;

            const remaining = Math.max(0, timer.remaining);
            display.textContent = formatTime(remaining);

            display.classList.remove('warning', 'danger');
            if (timer.isFinished || remaining <= 0) display.classList.add('danger');
            else if (remaining <= MAX_SECONDS * 0.25) display.classList.add('danger');
            else if (remaining <= MAX_SECONDS * 0.5) display.classList.add('warning');

            status.classList.remove('playing', 'paused', 'stopped');
            if (timer.isFinished || remaining <= 0) {
                status.textContent = 'HABIS';
                status.classList.add('stopped');
            } else if (timer.isRunning && !timer.isPaused) {
                status.textContent = 'Berjalan';
                status.classList.add('playing');
            } else if (timer.isPaused) {
                status.textContent = 'Jeda';
                status.classList.add('paused');
            } else {
                status.textContent = 'Siap';
            }

            card.classList.remove('active', 'paused', 'finished');
            if (timer.isFinished || remaining <= 0) {
                card.classList.add('finished');
                habis.style.display = 'block';
                display.style.display = 'none';
            } else {
                habis.style.display = 'none';
                display.style.display = 'block';
                if (timer.isRunning && !timer.isPaused) card.classList.add('active');
                else if (timer.isPaused) card.classList.add('paused');
            }

            if (btnBayar) {
                const harga = getHargaBayar(timer);
                if (timer.sudahBayar) {
                    btnBayar.classList.add('sudah-bayar');
                    btnBayar.textContent = '✅ Bayar';
                } else {
                    btnBayar.classList.remove('sudah-bayar');
                    btnBayar.textContent = timer.jumlahLanjut > 0 ?
                        `💰 ${formatRupiah(harga)} (x${timer.jumlahLanjut + 1})` :
                        `💰 ${formatRupiah(harga)}`;
                }
            }
        }

        // ==========================================
        // RENDER
        // ==========================================
        function renderTimers() {
            grid.innerHTML = '';
            timers.forEach((timer, idx) => {
                const card = document.createElement('div');
                card.className = 'timer-card';

                const label = document.createElement('div');
                label.className = 'unit-label';
                label.textContent = timer.label;

                const display = document.createElement('div');
                display.className = 'timer-display';
                display.textContent = formatTime(timer.remaining);

                const habis = document.createElement('div');
                habis.className = 'habis-badge';
                habis.textContent = 'HABIS';

                const status = document.createElement('div');
                status.className = 'status-badge';
                status.textContent = 'Siap';

                const actions = document.createElement('div');
                actions.className = 'unit-actions';

                const btnStart = document.createElement('button');
                btnStart.className = 'btn btn-start';
                btnStart.textContent = '▶ Start';
                btnStart.dataset.index = idx;

                const btnReset = document.createElement('button');
                btnReset.className = 'btn btn-reset';
                btnReset.textContent = '⟳ Reset';
                btnReset.dataset.index = idx;

                const btnLanjut = document.createElement('button');
                btnLanjut.className = 'btn btn-lanjut';
                btnLanjut.textContent = '⏩ Lanjut';
                btnLanjut.dataset.index = idx;

                const btnBayar = document.createElement('button');
                btnBayar.className = 'btn btn-bayar';
                btnBayar.textContent = `💰 ${formatRupiah(getHargaBayar(timer))}`;
                btnBayar.dataset.index = idx;

                actions.append(btnStart, btnReset, btnLanjut, btnBayar);
                card.append(label, display, habis, status, actions);
                grid.appendChild(card);

                timer.dom = { card, display, status, habis, btnBayar };

                btnStart.addEventListener('click', () => startUnit(idx));
                btnReset.addEventListener('click', () => resetUnit(idx));
                btnLanjut.addEventListener('click', () => lanjutUnit(idx));
                btnBayar.addEventListener('click', () => bayarUnit(idx));

                updateCardVisuals(timer);
            });
        }

        function renderRekap() {
            rekapGrid.innerHTML = '';
            timers.forEach((_, i) => {
                const item = document.createElement('div');
                item.className = 'rekap-item';
                item.innerHTML = `
                        <span class="unit-name">Unit ${i + 1}</span>
                        <span class="unit-omzet" id="omzetTotal_${i}">${formatRupiah(omzet[i] || 0)}</span>
                    `;
                rekapGrid.appendChild(item);
            });
            updateTotalOmzet();
        }

        function updateRekap() {
            timers.forEach((_, i) => {
                const el = document.getElementById(`omzetTotal_${i}`);
                if (el) el.textContent = formatRupiah(omzet[i] || 0);
            });
            updateTotalOmzet();
        }

        function updateTotalOmzet() {
            totalOmzetEl.textContent = formatRupiah(omzet.reduce((a, b) => (a || 0) + (b || 0), 0));
        }

        // ==========================================
        // UNIT CONTROL
        // ==========================================
        function startUnit(idx) {
            if (idx >= timers.length) return;
            const t = timers[idx];
            if (t.remaining <= 0) { resetUnit(idx);
                setTimeout(() => startUnit(idx), 50); return; }
            if (t.isPaused) { t.isPaused = false;
                t.isRunning = true; } else if (!t.isRunning) { t.isRunning = true;
                t.isPaused = false;
                t.isFinished = false; }
            updateCardVisuals(t);
            startGlobalInterval();
            saveToFirebase();
        }

        function resetUnit(idx) {
            if (idx >= timers.length) return;
            const t = timers[idx];
            t.isRunning = false;
            t.isPaused = false;
            t.isFinished = false;
            t.remaining = MAX_SECONDS;
            t.sudahBayar = false;
            t.jumlahLanjut = 0;
            updateCardVisuals(t);
            checkAndClearInterval();
            saveToFirebase();
        }

        function lanjutUnit(idx) {
            if (idx >= timers.length) return;
            const t = timers[idx];
            if (t.remaining <= 0) {
                t.jumlahLanjut += 1;
                t.remaining = MAX_SECONDS;
                t.isFinished = false;
                t.isRunning = true;
                t.isPaused = false;
                t.sudahBayar = false;
                updateCardVisuals(t);
                startGlobalInterval();
                saveToFirebase();
            }
        }

        function bayarUnit(idx) {
            if (idx >= timers.length) return;
            const t = timers[idx];
            if (t.sudahBayar) { alert('Unit ini sudah dibayar!'); return; }
            const harga = getHargaBayar(t);
            t.sudahBayar = true;
            omzet[idx] = (omzet[idx] || 0) + harga;
            updateRekap();
            updateCardVisuals(t);
            saveToFirebase();
            const el = document.getElementById(`omzetTotal_${idx}`);
            if (el) { el.style.color = '#facc15';
                setTimeout(() => { el.style.color = '#4ade80'; }, 500); }
        }

        // ==========================================
        // OPERATOR CONTROL
        // ==========================================
        function startAll() {
            timers.forEach((t, idx) => {
                if (t.remaining <= 0) resetUnit(idx);
                if (t.remaining > 0 && !t.isRunning) { t.isRunning = true;
                    t.isPaused = false;
                    t.isFinished = false; } else if (t.isPaused && t.remaining > 0) { t.isPaused = false;
                    t.isRunning = true; }
                updateCardVisuals(t);
            });
            startGlobalInterval();
            saveToFirebase();
        }

        function pauseAll() {
            timers.forEach(t => {
                if (t.isRunning && !t.isPaused && t.remaining > 0) { t.isPaused = true;
                    updateCardVisuals(t); }
            });
            if (!timerInterval) startGlobalInterval();
            saveToFirebase();
        }

        // ==========================================
        // TAMBAH / KURANG UNIT
        // ==========================================
        function tambahUnit() {
            const idx = timers.length;
            timers.push(createTimerData(idx));
            omzet.push(0);
            timers.forEach(t => { t.isRunning = false;
                t.isPaused = false; });
            renderTimers();
            renderRekap();
            saveToFirebase();
            catatanStatus.textContent = '✅ Unit ' + (idx + 1) + ' ditambahkan';
            setTimeout(() => { catatanStatus.textContent = ''; }, 2000);
        }

        function kurangUnit() {
            if (timers.length <= 1) { alert('Minimal 1 unit!'); return; }
            timers.pop();
            omzet.pop();
            timers.forEach(t => { t.isRunning = false;
                t.isPaused = false; });
            renderTimers();
            renderRekap();
            saveToFirebase();
            catatanStatus.textContent = '🗑️ Unit ' + (timers.length + 1) + ' dihapus';
            setTimeout(() => { catatanStatus.textContent = ''; }, 2000);
        }

        // ==========================================
        // HARGA
        // ==========================================
        function setHarga() {
            const val = parseInt(hargaInput.value);
            if (!isNaN(val) && val > 0) {
                HARGA_PER_BAYAR = val;
                document.querySelectorAll('.btn-bayar').forEach(btn => {
                    const idx = parseInt(btn.dataset.index);
                    if (!isNaN(idx) && idx < timers.length && !timers[idx].sudahBayar) {
                        const harga = getHargaBayar(timers[idx]);
                        btn.textContent = timers[idx].jumlahLanjut > 0 ?
                            `💰 ${formatRupiah(harga)} (x${timers[idx].jumlahLanjut + 1})` :
                            `💰 ${formatRupiah(harga)}`;
                    }
                });
                catatanStatus.textContent = '✅ Harga diset: ' + formatRupiah(HARGA_PER_BAYAR);
                setTimeout(() => { catatanStatus.textContent = ''; }, 2000);
                saveToFirebase();
            } else {
                alert('Masukkan harga yang valid!');
            }
        }

        // ==========================================
        // RESET & CETAK
        // ==========================================
        function resetOmzet() {
            if (confirm('Yakin ingin mereset semua data omzet hari ini?')) {
                omzet = omzet.map(() => 0);
                timers.forEach(t => {
                    t.sudahBayar = false;
                    t.jumlahLanjut = 0;
                    t.remaining = MAX_SECONDS;
                    t.isRunning = false;
                    t.isPaused = false;
                    t.isFinished = false;
                });
                renderTimers();
                renderRekap();
                saveToFirebase();
                catatanStatus.textContent = '🔄 Omzet direset';
                setTimeout(() => { catatanStatus.textContent = ''; }, 2000);
            }
        }

        function cetakRekap() {
            let teks = '========================================\n';
            teks += '     REKAP OMZET ODONG-ODONG\n';
            teks += '     ' + todayDisplay + '\n';
            teks += '========================================\n\n';
            let total = 0;
            timers.forEach((_, i) => {
                const val = omzet[i] || 0;
                teks += `Unit ${i + 1} : ${formatRupiah(val)}\n`;
                total += val;
            });
            teks += '\n----------------------------------------\n';
            teks += `TOTAL : ${formatRupiah(total)}\n`;
            teks += '========================================\n';
            const catatan = catatanInput.value.trim();
            if (catatan) { teks += '\n📝 Catatan:\n' + catatan + '\n========================================\n'; }
            const w = window.open('', '_blank', 'width=400,height=600');
            w.document.write(`<html><head><title>Rekap Omzet</title><style>body{font-family:monospace;padding:20px;white-space:pre;}</style></head><body><pre>${teks}</pre></body></html>`);
            w.document.close();
            w.print();
        }

        // ==========================================
        // GLOBAL INTERVAL
        // ==========================================
        function startGlobalInterval() {
            if (timerInterval) return;
            timerInterval = setInterval(() => {
                let anyRunning = false;
                timers.forEach(t => {
                    if (t.isRunning && !t.isPaused && t.remaining > 0) {
                        t.remaining = Math.max(0, t.remaining - 1);
                        anyRunning = true;
                        if (t.remaining <= 0) { t.isRunning = false;
                            t.isFinished = true;
                            t.isPaused = false; }
                    }
                    updateCardVisuals(t);
                });
                if (!anyRunning && timerInterval) { clearInterval(timerInterval);
                    timerInterval = null; }
                if (anyRunning) saveToFirebase();
            }, 1000);
        }

        function checkAndClearInterval() {
            if (!timers.some(t => t.isRunning && !t.isPaused && t.remaining > 0) && timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        // ==========================================
        // FIREBASE SAVE / LOAD
        // ==========================================
        function saveToFirebase() {
            if (isSyncing) return;
            getDataRef().set({
                timers: timers.map(t => ({
                    remaining: t.remaining,
                    isRunning: t.isRunning,
                    isPaused: t.isPaused,
                    isFinished: t.isFinished,
                    sudahBayar: t.sudahBayar,
                    jumlahLanjut: t.jumlahLanjut
                })),
                omzet: omzet,
                harga: HARGA_PER_BAYAR,
                unitCount: timers.length,
                lastUpdated: firebase.database.ServerValue.TIMESTAMP
            }).catch(console.error);
        }

        function loadFromFirebase() {
            getDataRef().on('value', (snap) => {
                const data = snap.val();
                if (data) {
                    isSyncing = true;
                    if (data.timers) {
                        const newTimers = [];
                        data.timers.forEach((d, i) => {
                            const t = createTimerData(i);
                            t.remaining = d.remaining !== undefined ? d.remaining : MAX_SECONDS;
                            t.isRunning = false;
                            t.isPaused = false;
                            t.isFinished = d.isFinished || false;
                            t.sudahBayar = d.sudahBayar || false;
                            t.jumlahLanjut = d.jumlahLanjut || 0;
                            newTimers.push(t);
                        });
                        timers = newTimers;
                        omzet = data.omzet || [];
                        while (omzet.length < timers.length) omzet.push(0);
                    }
                    if (data.harga) { HARGA_PER_BAYAR = data.harga;
                        hargaInput.value = data.harga; }
                    renderTimers();
                    renderRekap();
                    isSyncing = false;
                    isDataLoaded = true;
                } else if (!isDataLoaded) {
                    initDefaultData();
                }
            }, (err) => { console.error(err); if (!isDataLoaded) initDefaultData(); });
        }

        function initDefaultData() {
            timers = [];
            omzet = [];
            for (let i = 0; i < UNIT_COUNT; i++) { timers.push(createTimerData(i));
                omzet.push(0); }
            renderTimers();
            renderRekap();
            isDataLoaded = true;
            saveToFirebase();
        }

        // ==========================================
        // CATATAN
        // ==========================================
        function loadCatatan() {
            database.ref('catatan/' + todayKey).on('value', (snap) => {
                const data = snap.val();
                if (data) catatanInput.value = data;
            });
        }

        function simpanCatatan() {
            database.ref('catatan/' + todayKey).set(catatanInput.value);
            catatanStatus.textContent = '✅ Catatan disimpan ' + new Date().toLocaleTimeString();
            setTimeout(() => { catatanStatus.textContent = ''; }, 3000);
        }

        function resetCatatan() {
            database.ref('catatan/' + todayKey).remove();
            catatanInput.value = '';
            catatanStatus.textContent = '🗑️ Catatan dikosongkan';
            setTimeout(() => { catatanStatus.textContent = ''; }, 2000);
        }

        // ==========================================
        // INIT
        // ==========================================
        function initApp() {
            if (appInited) return;
            appInited = true;

            // Load data dari Firebase
            loadFromFirebase();
            loadCatatan();

            // Tambahkan event listener
            startAllBtn.addEventListener('click', startAll);
            pauseAllBtn.addEventListener('click', pauseAll);
            tambahUnitBtn.addEventListener('click', tambahUnit);
            kurangUnitBtn.addEventListener('click', kurangUnit);
            setHargaBtn.addEventListener('click', setHarga);
            resetOmzetBtn.addEventListener('click', resetOmzet);
            cetakRekapBtn.addEventListener('click', cetakRekap);

            hargaInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') setHarga(); });
            document.getElementById('simpanCatatanBtn').addEventListener('click', simpanCatatan);
            document.getElementById('resetCatatanBtn').addEventListener('click', resetCatatan);

            // Periodic save
            setInterval(() => { if (isDataLoaded) saveToFirebase(); }, 10000);
            
            // Save on unload
            window.addEventListener('beforeunload', () => saveToFirebase());
            
            updateTotalOmzet();
        }

        // ==========================================
        // START
        // ==========================================
        checkSession();
        setInterval(() => { if (!lockScreen.classList.contains('hidden')) updateStatusInfo(); }, 30000);
    </script>

</body>
</html>
