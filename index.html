<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timer Pemain Odong-Odong · 7 Unit</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: linear-gradient(145deg, #1e293b 0%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            margin: 0;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 48px;
            padding: 28px 24px 32px;
            box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.8), inset 0 2px 0 rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            margin-bottom: 28px;
            border-bottom: 1px solid rgba(255, 215, 0, 0.15);
            padding-bottom: 12px;
        }

        .header h1 {
            font-weight: 600;
            font-size: 1.9rem;
            letter-spacing: 1px;
            background: linear-gradient(to right, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header h1 small {
            font-size: 1rem;
            font-weight: 400;
            color: #94a3b8;
            background: rgba(255, 255, 255, 0.05);
            padding: 0 12px;
            border-radius: 40px;
            letter-spacing: 0.3px;
        }

        .unit-badge {
            background: #1e293b;
            padding: 6px 18px;
            border-radius: 40px;
            color: #facc15;
            font-weight: 600;
            font-size: 1.1rem;
            border: 1px solid #facc1550;
            box-shadow: 0 0 12px #facc1520;
        }

        /* GRID 7 UNIT */
        .timer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 18px;
            margin: 24px 0 28px;
        }

        .timer-card {
            background: #0b1120;
            border-radius: 32px;
            padding: 18px 12px 20px;
            text-align: center;
            border: 1px solid #2d3a52;
            box-shadow: inset 0 -6px 0 #0f172a, 0 8px 20px rgba(0, 0, 0, 0.6);
            transition: all 0.15s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .timer-card.active {
            border-color: #facc15;
            box-shadow: 0 0 20px #facc1540, inset 0 -6px 0 #facc15;
        }

        .timer-card.paused {
            opacity: 0.7;
            border-color: #64748b;
        }

        .timer-card.finished {
            border-color: #ef4444;
            box-shadow: 0 0 20px #ef444430, inset 0 -6px 0 #ef4444;
        }

        .unit-label {
            font-size: 1.1rem;
            font-weight: 600;
            color: #e2e8f0;
            background: #1e293b;
            padding: 2px 16px;
            border-radius: 40px;
            display: inline-block;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .timer-display {
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-size: 3.2rem;
            font-weight: 700;
            color: #f8fafc;
            text-shadow: 0 0 12px #38bdf850;
            letter-spacing: 2px;
            line-height: 1.2;
            margin: 6px 0 2px;
            background: #0f172a;
            padding: 4px 8px;
            border-radius: 40px;
            width: 100%;
        }

        .timer-display.warning {
            color: #facc15;
            text-shadow: 0 0 20px #facc15;
        }

        .timer-display.danger {
            color: #f87171;
            text-shadow: 0 0 25px #ef4444;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .status-badge {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: #1e293b;
            padding: 2px 14px;
            border-radius: 40px;
            color: #94a3b8;
            margin-top: 4px;
            border: 1px solid #334155;
        }

        .status-badge.playing {
            color: #4ade80;
            border-color: #4ade8060;
        }

        .status-badge.paused {
            color: #facc15;
            border-color: #facc1560;
        }

        .status-badge.stopped {
            color: #f87171;
            border-color: #f8717160;
        }

        /* TOMBOL KONTROL */
        .action-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px 16px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #334155;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #1e293b;
            border: none;
            padding: 10px 22px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.95rem;
            color: #e2e8f0;
            cursor: pointer;
            transition: all 0.15s ease;
            border: 1px solid #334155;
            box-shadow: 0 4px 0 #0f172a;
            letter-spacing: 0.3px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #0f172a;
            background: #2d3a52;
        }

        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #0f172a;
        }

        .btn-primary {
            background: #facc15;
            color: #0f172a;
            border-color: #fbbf24;
            box-shadow: 0 4px 0 #b45309;
        }

        .btn-primary:hover {
            background: #fde047;
            border-color: #facc15;
        }

        .btn-danger {
            background: #dc2626;
            border-color: #b91c1c;
            box-shadow: 0 4px 0 #7f1d1d;
        }

        .btn-danger:hover {
            background: #ef4444;
        }

        .btn-success {
            background: #16a34a;
            border-color: #15803d;
            box-shadow: 0 4px 0 #14532d;
        }

        .btn-success:hover {
            background: #22c55e;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid #475569;
            box-shadow: none;
        }

        .btn-outline:hover {
            background: #1e293b;
            border-color: #94a3b8;
        }

        .btn:disabled {
            opacity: 0.4;
            transform: translateY(0px);
            box-shadow: 0 4px 0 #0f172a;
            pointer-events: none;
        }

        /* footer */
        .footer {
            margin-top: 20px;
            color: #64748b;
            font-size: 0.8rem;
            text-align: center;
            letter-spacing: 0.3px;
            border-top: 1px solid #1e293b;
            padding-top: 14px;
        }

        .footer span {
            color: #94a3b8;
        }

        @media (max-width: 650px) {
            .container {
                padding: 16px;
            }
            .timer-grid {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
                gap: 12px;
            }
            .timer-display {
                font-size: 2.5rem;
            }
            .header h1 {
                font-size: 1.5rem;
            }
            .btn {
                padding: 8px 16px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>
            🎠 ODONG-ODONG
            <small>7 unit</small>
        </h1>
        <div class="unit-badge">⏱️ 4:00 max</div>
    </div>

    <!-- GRID 7 UNIT -->
    <div id="timerGrid" class="timer-grid"></div>

    <!-- KONTROL GLOBAL -->
    <div class="action-bar">
        <button class="btn btn-success" id="startAllBtn">▶ Start all</button>
        <button class="btn btn-outline" id="pauseAllBtn">⏸ Pause all</button>
        <button class="btn btn-danger" id="stopAllBtn">⏹ Stop all</button>
        <button class="btn btn-primary" id="resetAllBtn">⟳ Reset all</button>
    </div>
    <div class="footer">
        <span>⚡ Durasi maksimal 4 menit · tiap unit berjalan independen</span>
    </div>
</div>

<script>
    (function() {
        const UNIT_COUNT = 7;
        const MAX_SECONDS = 240; // 4 menit
        let timers = [];
        let timerInterval = null;

        // DOM element container
        const grid = document.getElementById('timerGrid');

        // ———— inisialisasi data timer ————
        function createTimerData(index) {
            return {
                id: index,
                label: `Unit ${index + 1}`,
                elapsed: 0,         // detik berjalan
                isRunning: false,
                isPaused: false,
                isFinished: false,
                dom: {
                    card: null,
                    display: null,
                    status: null,
                }
            };
        }

        // ———— render ulang semua card ————
        function renderTimers() {
            grid.innerHTML = '';
            timers.forEach((timer, idx) => {
                const card = document.createElement('div');
                card.className = 'timer-card';
                card.dataset.index = idx;

                const label = document.createElement('div');
                label.className = 'unit-label';
                label.textContent = timer.label;

                const display = document.createElement('div');
                display.className = 'timer-display';
                display.textContent = formatTime(timer.elapsed);

                const status = document.createElement('div');
                status.className = 'status-badge';
                status.textContent = 'Siap';

                card.appendChild(label);
                card.appendChild(display);
                card.appendChild(status);

                grid.appendChild(card);

                // simpan referensi DOM
                timer.dom.card = card;
                timer.dom.display = display;
                timer.dom.status = status;

                // update status visual
                updateCardVisuals(timer);
            });
        }

        // ———— format waktu mm:ss ————
        function formatTime(seconds) {
            const sec = Math.min(seconds, MAX_SECONDS);
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        // ———— update tampilan dan class ————
        function updateCardVisuals(timer) {
            const { display, status, card } = timer.dom;
            if (!card) return;

            // display
            const elapsed = Math.min(timer.elapsed, MAX_SECONDS);
            display.textContent = formatTime(elapsed);

            // warna warning / danger
            display.classList.remove('warning', 'danger');
            if (elapsed >= MAX_SECONDS) {
                display.classList.add('danger');
            } else if (elapsed >= MAX_SECONDS * 0.75) {
                display.classList.add('warning');
            }

            // status badge
            status.classList.remove('playing', 'paused', 'stopped');
            if (timer.isFinished || elapsed >= MAX_SECONDS) {
                status.textContent = 'Selesai';
                status.classList.add('stopped');
            } else if (timer.isRunning && !timer.isPaused) {
                status.textContent = 'Berjalan';
                status.classList.add('playing');
            } else if (timer.isPaused) {
                status.textContent = 'Jeda';
                status.classList.add('paused');
            } else {
                status.textContent = 'Siap';
            }

            // card state
            card.classList.remove('active', 'paused', 'finished');
            if (timer.isFinished || elapsed >= MAX_SECONDS) {
                card.classList.add('finished');
            } else if (timer.isRunning && !timer.isPaused) {
                card.classList.add('active');
            } else if (timer.isPaused) {
                card.classList.add('paused');
            }
        }

        // ———— tick global (update tiap detik) ————
        function tick() {
            let anyRunning = false;
            timers.forEach(timer => {
                // hanya berjalan jika running & tidak pause & belum mencapai max
                if (timer.isRunning && !timer.isPaused && timer.elapsed < MAX_SECONDS) {
                    timer.elapsed = Math.min(timer.elapsed + 1, MAX_SECONDS);
                    anyRunning = true;

                    // jika mencapai MAX, otomatis stop running (tapi status finished)
                    if (timer.elapsed >= MAX_SECONDS) {
                        timer.isRunning = false;
                        timer.isFinished = true;
                        timer.isPaused = false;
                    }
                }
                // update tampilan tiap unit
                updateCardVisuals(timer);
            });

            // jika tidak ada yang running, hentikan interval global (hemat资源)
            if (!anyRunning && timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
                // pastikan semua status visual tetap konsisten
            }
        }

        // ———— memulai interval global jika belum jalan ————
        function startGlobalInterval() {
            if (timerInterval) return;
            timerInterval = setInterval(tick, 1000);
        }

        // ———— START semua ————
        function startAll() {
            let anyStarted = false;
            timers.forEach(timer => {
                // hanya jika belum selesai dan belum mencapai max
                if (timer.elapsed < MAX_SECONDS && !timer.isFinished) {
                    // jika paused, lanjutkan
                    if (timer.isPaused) {
                        timer.isPaused = false;
                        timer.isRunning = true;
                    } else if (!timer.isRunning) {
                        // mulai dari awal / lanjut (tidak reset)
                        timer.isRunning = true;
                        timer.isPaused = false;
                        timer.isFinished = false;
                    }
                    anyStarted = true;
                } else if (timer.elapsed >= MAX_SECONDS) {
                    // jika sudah mencapai max, set finished
                    timer.isRunning = false;
                    timer.isPaused = false;
                    timer.isFinished = true;
                }
                updateCardVisuals(timer);
            });

            if (anyStarted) {
                startGlobalInterval();
            } else {
                // jika semua sudah selesai, tidak perlu interval
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }
            }
        }

        // ———— PAUSE semua ————
        function pauseAll() {
            let anyPaused = false;
            timers.forEach(timer => {
                if (timer.isRunning && !timer.isPaused && timer.elapsed < MAX_SECONDS) {
                    timer.isPaused = true;
                    // isRunning tetap true agar bisa dilanjutkan
                    anyPaused = true;
                }
                updateCardVisuals(timer);
            });

            // jika ada yang di-pause, interval tetap berjalan (tick tidak akan menambah elapsed)
            // tapi kita biarkan interval tetap jalan, atau bisa juga dipertahankan.
            // Lebih baik tetap jalan agar timer tidak berhenti total.
            if (anyPaused && !timerInterval) {
                startGlobalInterval();
            }
        }

        // ———— STOP semua (berhenti, reset elapsed ke 0) ————
        function stopAll() {
            timers.forEach(timer => {
                timer.isRunning = false;
                timer.isPaused = false;
                timer.isFinished = false;
                timer.elapsed = 0;
                updateCardVisuals(timer);
            });

            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        // ———— RESET semua (kembali ke 0, siap main) ————
        function resetAll() {
            timers.forEach(timer => {
                timer.isRunning = false;
                timer.isPaused = false;
                timer.isFinished = false;
                timer.elapsed = 0;
                updateCardVisuals(timer);
            });

            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        // ———— inisialisasi awal ————
        function init() {
            // buat 7 unit
            for (let i = 0; i < UNIT_COUNT; i++) {
                timers.push(createTimerData(i));
            }
            renderTimers();

            // event listeners
            document.getElementById('startAllBtn').addEventListener('click', startAll);
            document.getElementById('pauseAllBtn').addEventListener('click', pauseAll);
            document.getElementById('stopAllBtn').addEventListener('click', stopAll);
            document.getElementById('resetAllBtn').addEventListener('click', resetAll);

            // default state: siap
            timers.forEach(t => updateCardVisuals(t));
        }

        init();
    })();
</script>
</body>
</html>
